name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://parser:parser@localhost:5432/parser_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: staging
      PARSER_USER_AGENT: "SimpleParser/1.0 (test@example.com)"
      PARSER_BASE_URL: "https://api.hh.ru"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parser
          POSTGRES_PASSWORD: parser
          POSTGRES_DB: parser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run migrations
        run: |
          alembic upgrade head

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src

      - name: Tests
        run: |
          pytest --cov=src --cov-report=term-missing --cov-fail-under=70