services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: parser
      POSTGRES_PASSWORD: parser
      POSTGRES_DB: parser
    ports:
      - "5458:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parser"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build: .
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://parser:parser@postgres:5432/parser
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: local
      PARSER_USER_AGENT: "SimpleParser/1.0 (test@example.com)"
      PARSER_BASE_URL: "https://api.hh.ru"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: postgresql+asyncpg://parser:parser@postgres:5432/parser
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: local
      PARSER_USER_AGENT: "SimpleParser/1.0 (test@example.com)"
      PARSER_BASE_URL: "https://api.hh.ru"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq src.workers.settings.WorkerSettings

volumes:
  pgdata: