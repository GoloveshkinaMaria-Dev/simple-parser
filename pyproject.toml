[project]
name = "simple-parser"
version = "0.1.0"
description = "Resume/vacancy parser service with background jobs"
requires-python = ">=3.12"
dependencies = [
    # web
    "fastapi",
    "uvicorn[standard]",

    # pydantic / config
    "pydantic",
    "pydantic-settings",
    "python-dotenv",

    # db
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",

    # background jobs
    "arq",
    "redis",

    # parser
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
    "types-requests",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"


[tool.mypy]
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "src.config"
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
module = ["arq.*", "asyncpg.*"]
ignore_missing_imports = true


[tool.ruff]
extend-exclude = ["alembic/versions"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TRY", "RUF"]
extend-ignore = ["B008", "TRY003", "RUF002"]